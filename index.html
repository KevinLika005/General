<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f1ee" data-light="#f2f1ee" data-dark="#181614" />
    <link rel="icon" type="image/png" href="/src/assets/general-logo-tab.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap"
    />
    <!-- seo:start (replaced per route by scripts/prerender.mjs; set at runtime by useRouteSeo) -->
    <title>GENERAL TRADING</title>
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.documentElement;
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var storedTheme = null;

        try {
          var themeValue = window.localStorage.getItem('general-trading-theme');
          storedTheme = themeValue === 'light' || themeValue === 'dark' ? themeValue : null;
        } catch (error) {
          storedTheme = null;
        }

        var prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = storedTheme || (prefersDark ? 'dark' : 'light');

        root.dataset.theme = theme;
        root.classList.toggle('dark', theme === 'dark');
        root.style.colorScheme = theme;

        if (themeMeta) {
          var nextThemeColor =
            theme === 'dark'
              ? themeMeta.getAttribute('data-dark') || '#181614'
              : themeMeta.getAttribute('data-light') || '#f2f1ee';
          themeMeta.setAttribute('content', nextThemeColor);
        }

        try {
          // /en/... pages exist only when English URLs are enabled; there the URL decides.
          document.documentElement.lang =
            /^\/en(\/|$)/.test(window.location.pathname) ||
            window.localStorage.getItem('general-trading-language') === 'en'
              ? 'en'
              : 'sq';
        } catch (error) {
          // Keep the default lang="sq".
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
